name: Bratonien Prebuilt Images

on:
  push:
    branches:
      - bratonien/development
  workflow_dispatch:

concurrency:
  group: bratonien-prebuilt-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/terranom674/bratonien-manifold

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-api:bratonien-development
            ${{ env.IMAGE_BASE }}-api:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-client:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./client
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-client:bratonien-development
            ${{ env.IMAGE_BASE }}-client:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
