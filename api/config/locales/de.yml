        public_reading_groups_disabled: "Öffentliche Lesegruppen sind deaktiviert"
        spam: "ist Spam"
      models:
        resource:
          attributes:
            external_id:
              missing: "^Die Video-ID darf nicht leer sein."
        page:
          attributes:
            purpose:
              in_use: "kann nicht mehr als einer Seite zugewiesen werden"
        resource_import:
          attributes:
            url:
              blank: "für die Google-Tabelle darf nicht leer sein. Bitte lade eine gültige CSV-Datei hoch oder gib die URL einer öffentlichen Google-Tabelle ein"
            source:
              inclusion: "enthält ungültige Daten. Bitte lade eine gültige CSV-Datei hoch oder gib die URL einer öffentlichen Google-Tabelle ein"
  classy_enum:
    user_classification:
      anonymous: "Anonym"
      command_line: "CLI"
      deleted: "Gelöscht"
