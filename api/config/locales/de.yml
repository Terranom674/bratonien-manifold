      unauthorized:
        title: "Authentifizierung erforderlich"
        detail: "Du musst angemeldet sein, um auf diese Ressource zuzugreifen."
      not_found:
        title: "Ressource nicht gefunden"
        detail: "Manifold hat versucht, auf einen API-Endpunkt zuzugreifen, der nicht existiert."
      bad_request:
        title: "Ungültige Anfrage"
        detail: "Die Anfrage war ungültig."
      forbidden_generic:
        title: "Zugriff verweigert"
        detail: "Du bist nicht berechtigt, auf diese Ressource zuzugreifen."
      forbidden:
        class:
          title: "%{action} fehlgeschlagen"
          detail: "Du bist nicht berechtigt, %{action} für %{resource} auszuführen."
        instance:
          title: "%{action} fehlgeschlagen"
          detail: "Du bist nicht berechtigt, %{action} für %{resource} auszuführen."
