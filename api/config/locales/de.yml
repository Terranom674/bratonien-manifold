      - ~
      - Jan
      - Feb
      - Mär
      - Apr
      - Mai
      - Jun
      - Jul
      - Aug
      - Sep
      - Okt
      - Nov
      - Dez
    order:
      - :day
      - :month
      - :year
  time:
    formats:
      default: "%A, %d. %B %Y, %H:%M Uhr"
      short: "%d. %B, %H:%M Uhr"
      long: "%A, %d. %B %Y, %H:%M Uhr"
  support:
    array:
      words_connector: ", "
      two_words_connector: " und "
      last_word_connector: " und "
  errors:
    format: "%{attribute} %{message}"
    messages:
      accepted: "muss akzeptiert werden"
      blank: "muss ausgefüllt werden"
      confirmation: "stimmt nicht mit %{attribute} überein"
      empty: "muss ausgefüllt werden"
      equal_to: "muss gleich %{count} sein"
      even: "muss gerade sein"
      exclusion: "ist nicht verfügbar"
      greater_than: "muss größer als %{count} sein"
      greater_than_or_equal_to: "muss größer oder gleich %{count} sein"
      inclusion: "ist kein gültiger Wert"
      invalid: "ist ungültig"
      less_than: "muss kleiner als %{count} sein"
      less_than_or_equal_to: "muss kleiner oder gleich %{count} sein"
      model_invalid: "Validierung fehlgeschlagen: %{errors}"
      not_a_number: "ist keine Zahl"
      not_an_integer: "ist keine ganze Zahl"
      odd: "muss ungerade sein"
      other_than: "darf nicht gleich %{count} sein"
      present: "darf nicht ausgefüllt werden"
      required: "muss vorhanden sein"
      taken: "ist bereits vergeben"
      too_long:
        one: "ist zu lang (maximal 1 Zeichen)"
        other: "ist zu lang (maximal %{count} Zeichen)"
      too_short:
        one: "ist zu kurz (mindestens 1 Zeichen)"
        other: "ist zu kurz (mindestens %{count} Zeichen)"
      wrong_length:
        one: "hat die falsche Länge (muss genau 1 Zeichen lang sein)"
        other: "hat die falsche Länge (muss genau %{count} Zeichen lang sein)"
  attributes:
    descriptions:
      slug: "Eine eindeutige Kennung, die vom Benutzer gewünscht wird. Sie wird auf den pendingSlug oder den Titel gesetzt, sofern dieser noch nicht vergeben ist."
      pending_slug: "Die vom Benutzer gewünschte eindeutige Kennung. Sie kann bereits vergeben sein; in diesem Fall werden Zeichen angehängt, um sie eindeutig zu machen."
      avatar_meta: "Ein Hash mit Daten zum Avatarbild"
  swagger:
    access_denied: "\tDer API-Schlüssel verfügt nicht über die erforderlichen Berechtigungen für diese Anfrage."
    not_authenticated: "Es wurde kein gültiger API-Schlüssel angegeben."
    not_found: "Die angeforderte Ressource existiert nicht."
    unprocessable: "Auf Seiten von Manifold ist ein Fehler aufgetreten."
    index:
      summary: "Alle %{type} auflisten"
      summary_with_parent: "%{parent_article} %{parent_possessive} %{type} auflisten"
      success: "Gibt ein Array von %{type}-Ressourcen zurück."
    show:
      summary: "%{article} %{type} abrufen"
      summary_with_parent: "%{article} %{type} für %{parent_article} %{parent} abrufen"
      success: "Ruft %{article} %{type} ab."
    create:
      summary: "%{article} %{type} erstellen"
      summary_with_parent: "%{article} %{type} für %{parent_article} %{parent} erstellen"
      success: "Gibt die Ressource %{type} zurück."
    update:
      summary: "%{article} %{type} aktualisieren"
      summary_with_parent: "%{parent_article} %{parent_possessive} %{type} aktualisieren"
      success: "Gibt die aktualisierte Ressource %{type} zurück."
    destroy:
      summary: "%{article} %{type} löschen"
      summary_with_parent: "%{parent_article} %{parent_possessive} %{type} löschen"
      success: "Entfernt die Ressource %{type}."
  active_interaction:
    errors:
      messages:
        invalid: "ist ungültig"
  activerecord:
    attributes:
    errors:
      messages:
        record_invalid: "Validierung fehlgeschlagen: %{errors}"
        restrict_dependent_destroy:
          has_one: "Datensatz kann nicht gelöscht werden, da ein abhängiger Datensatz %{record} existiert"
